<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Sparse Attention 总体结构</title>
  <desc id="desc">输入隐藏状态同时进入常规注意力投影和 Lightning Indexer。Indexer 计算相关性并选择 Top-K，随后用选择结果限制核心注意力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font-family: "Noto Sans CJK SC"; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .label { font-family: "Noto Sans CJK SC"; font-size: 18px; font-weight: 600; fill: #0f172a; }
      .small { font-family: "Noto Sans CJK SC"; font-size: 15px; fill: #475569; }
      .formula { font-family: "Noto Serif CJK SC"; font-size: 18px; font-style: italic; fill: #0f172a; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .green-line { fill: none; stroke: #16a34a; stroke-width: 3; marker-end: url(#greenArrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">DeepSeek Sparse Attention（DSA）</text>

  <g filter="url(#shadow)">
    <rect x="315" y="90" width="570" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="121" text-anchor="middle" class="label">输出隐藏状态 u(t)</text>
    <text x="600" y="148" text-anchor="middle" class="small">仅聚合 Top-K 上下文位置的 Value</text>

    <rect x="250" y="210" width="700" height="86" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="600" y="246" text-anchor="middle" class="label">核心注意力（Core Attention）</text>
    <text x="600" y="274" text-anchor="middle" class="small">Softmax(QKᵀ + Causal Mask + Index Mask) · V</text>

    <rect x="70" y="370" width="310" height="108" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="225" y="406" text-anchor="middle" class="label">Q / K / V 投影</text>
    <text x="225" y="436" text-anchor="middle" class="formula">q(t,j) = WQ · h(t)</text>
    <text x="225" y="462" text-anchor="middle" class="formula">k(s) = WK · h(s)，v(s) = WV · h(s)</text>

    <rect x="455" y="360" width="290" height="126" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="600" y="397" text-anchor="middle" class="label">Top-K Selector</text>
    <text x="600" y="430" text-anchor="middle" class="formula">S(t) = TopK(I(t,:), K)</text>
    <text x="600" y="458" text-anchor="middle" class="small">生成 Index Mask</text>

    <rect x="820" y="335" width="310" height="178" rx="18" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
    <text x="975" y="374" text-anchor="middle" class="label">Lightning Indexer</text>
    <text x="975" y="410" text-anchor="middle" class="formula">kI(s) = WIK · h(s)</text>
    <text x="975" y="442" text-anchor="middle" class="formula">w(t,j) = Ww · h(t)</text>
    <text x="975" y="474" text-anchor="middle" class="formula">I(t,s) = sum_j w(t,j) ·</text>
    <text x="975" y="499" text-anchor="middle" class="formula">ReLU(q(t,j)^T · kI(s))</text>

    <rect x="300" y="610" width="600" height="72" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="641" text-anchor="middle" class="label">输入隐藏状态 h(t) / 历史隐藏状态 h(s)</text>
    <text x="600" y="667" text-anchor="middle" class="small">常规注意力分支与稀疏索引分支共享输入</text>
  </g>

  <path d="M600 610 C470 565, 320 540, 225 478" class="line"/>
  <path d="M600 610 C760 565, 900 550, 975 513" class="green-line"/>
  <path d="M225 370 C250 330, 370 320, 480 296" class="line"/>
  <path d="M975 335 C900 310, 800 330, 710 360" class="green-line"/>
  <path d="M600 360 L600 296" class="green-line"/>
  <path d="M600 210 L600 166" class="line"/>

  <text x="782" y="319" text-anchor="middle" class="small" fill="#15803d">索引分数 I(t,s)</text>
  <text x="646" y="330" class="small" fill="#15803d">Top-K 位置</text>
</svg>
